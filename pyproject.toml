[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onv-cex"
version = "0.1.0"
description = "Exchange adapter interface with a Binance spot/futures reference implementation (ccxt signing kernel, fail-closed demo mode, idempotent rate-limit retries)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "sftgroup", email = "security@onv.codes" }]
keywords = ["trading", "exchange", "binance", "ccxt", "market-data", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "requests>=2.28",
    "ccxt>=4.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://onv.codes/mcp-setup"
Repository = "https://github.com/sftgroup/onv-cex"
Security = "https://github.com/sftgroup/onv-cex/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
